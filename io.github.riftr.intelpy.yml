app-id: io.github.riftr.intelpy
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: 5.15-25.08
name: intelpy
command: run.sh
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --socket=pulseaudio
cleanup:
  - /lib/python3.*/*/*/docs
  - /lib/python3.*/*/*/examples
  - /lib/python3.*/*/*/tests
  - /lib/python3.*/*/*/*/tests
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - python3-requirements.yaml
  - name: intelpy
    buildsystem: simple
    build-commands:
      - mkdir -p /app/intelpy
      - cp -R * /app/intelpy
      - install -Dm755 ./buildscripts/flatpak-scripts/run.sh -t /app/bin/
      - install -Dm644 ./buildscripts/flatpak-scripts/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ./buildscripts/flatpak-scripts/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 ./buildscripts/flatpak-scripts/${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
    sources:
      - type: git
        url: https://github.com/Riftr/intelpy.git
        tag: 2.1.1
        commit: c126931a8256243b516c031ef0f863f9e5451575
